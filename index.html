<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Arrivals — Sheraton Milwaukee Brookfield</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Georgia',serif;background:#f0ebe2;color:#2c2820;min-height:100vh}
.shell{max-width:960px;margin:0 auto;padding:36px 24px 64px}
.header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-bottom:18px;margin-bottom:24px;border-bottom:1px solid rgba(0,0,0,0.1)}
.eyebrow{font-family:'Courier New',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8a7f6e;margin-bottom:5px}
h1{font-size:20px;font-weight:normal;color:#2c2820;letter-spacing:-.02em}
.meta{font-family:'Courier New',monospace;font-size:10px;color:#a09080;text-align:right;line-height:1.8}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:22px}
.stat{background:#e8e0d4;border:0.5px solid rgba(0,0,0,0.08);border-radius:7px;padding:11px 14px}
.stat-label{font-family:'Courier New',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#8a7f6e;margin-bottom:5px}
.stat-val{font-size:24px;font-weight:normal;line-height:1;color:#2c2820}
.stat-val.v-amber{color:#a05c10}
.stat-val.v-green{color:#2a7a4a}
.stat-sub{font-family:'Courier New',monospace;font-size:9px;color:#a09080;margin-top:3px}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.pill{font-family:'Courier New',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:4px 13px;border-radius:20px;cursor:pointer;border:0.5px solid rgba(0,0,0,0.15);background:transparent;color:#7a7060;transition:all .12s}
.pill:hover{background:rgba(0,0,0,0.05)}
.pill.active{background:#2c2820;color:#f0ebe2;border-color:#2c2820}
.tbl-wrap{background:#ece5db;border:0.5px solid rgba(0,0,0,0.1);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:#e0d8cc}
th{font-family:'Courier New',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#8a7f6e;padding:10px 12px;text-align:left;font-weight:normal;white-space:nowrap;border-bottom:0.5px solid rgba(0,0,0,0.08)}
tbody tr{border-bottom:0.5px solid rgba(0,0,0,0.06);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(0,0,0,0.03)}
td{padding:9px 12px;vertical-align:middle;color:#2c2820}
.day-row td{background:#e8e0d4;font-family:'Courier New',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#8a7f6e;padding:7px 12px;border-bottom:0.5px solid rgba(0,0,0,0.08)}
.cell-org{font-size:12px;color:#2c2820}
.cell-contact{font-family:'Courier New',monospace;font-size:10px;color:#9a8f7e;margin-top:2px}
.cell-rooms{font-size:15px;font-weight:normal;color:#1a4a80}
.cell-roomtype{font-family:'Courier New',monospace;font-size:9px;color:#9a8f7e;margin-top:2px}
.cell-rate{font-family:'Courier New',monospace;font-size:11px;color:#3c3428;white-space:nowrap}
.cell-dates{font-family:'Courier New',monospace;font-size:10px;color:#6a6050;white-space:nowrap}
.badge{display:inline-block;font-family:'Courier New',monospace;font-size:9px;padding:2px 7px;border-radius:4px;letter-spacing:.03em;white-space:nowrap}
.b-indi{background:rgba(0,0,0,0.06);color:#7a7060;border:0.5px solid rgba(0,0,0,0.08)}
.b-master{background:#d8f0e4;color:#1a6038;border:0.5px solid #7ecaa0;font-weight:bold}
.notes{display:flex;flex-wrap:wrap;gap:3px}
.note-tag{font-family:'Courier New',monospace;font-size:9px;padding:1px 6px;border-radius:3px;background:rgba(0,0,0,0.05);color:#7a7060;border:0.5px solid rgba(0,0,0,0.07)}
.note-alert{background:#faebd0;color:#8a4808;border-color:#d4943a;font-weight:bold}
.note-check{background:#fce8e8;color:#8a2020;border-color:#d48080;font-weight:bold}
.row-alert td:first-child{box-shadow:inset 3px 0 0 #c8841a}
.row-master td:first-child{box-shadow:inset 3px 0 0 #3a9e68}
.empty-row td{padding:32px;text-align:center;font-family:'Courier New',monospace;font-size:11px;color:#9a8f7e;letter-spacing:.06em}
.footer{margin-top:28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-family:'Courier New',monospace;font-size:9px;color:#a09080;letter-spacing:.05em;text-transform:uppercase}
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <div>
      <div class="eyebrow">Sheraton Milwaukee Brookfield · Front Desk Reference</div>
      <h1>Incoming Groups — May 2026</h1>
    </div>
    <div class="meta">Updated: Apr 29, 2026<br>Confidential · Internal Use Only</div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="filters">
    <button class="pill active" onclick="filter('all',this)">All dates</button>
    <button class="pill" onclick="filter(1,this)">May 1</button>
    <button class="pill" onclick="filter(7,this)">May 7</button>
    <button class="pill" onclick="filter(8,this)">May 8</button>
    <button class="pill" onclick="filter(9,this)">May 9</button>
    <button class="pill" onclick="filter(11,this)">May 11</button>
    <button class="pill" onclick="filter(12,this)">May 12</button>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>Organization</th>
          <th>Arrival → Dep.</th>
          <th>Rooms</th>
          <th>Rate</th>
          <th>Billing</th>
          <th>Notes & Alerts</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="footer">
    <span>Sheraton Milwaukee Brookfield · 375 S Moorland Rd, Brookfield WI 53005</span>
    <span>Not for external distribution</span>
  </div>
</div>

<script>
const dayOfWeek={1:'Friday',2:'Saturday',3:'Sunday',7:'Thursday',8:'Friday',9:'Saturday',10:'Sunday',11:'Monday',12:'Tuesday',13:'Wednesday',14:'Thursday',15:'Friday',16:'Saturday'};

const groups=[
  {
    org:"Titans 17U — Basketball",
    contact:"Heather Spencer",
    arr:1,dep:3,rooms:24,
    rtype:"Trad. 2 Queens",
    rate:"$104",billing:"Individual",
    notes:["Breakfast incl.","Basketball OAW New Berlin","Individual pay own"],
    alert:null,check:false,master:false
  },
  {
    org:"BMIMC / Pro Dance Elite",
    contact:"Aileen Carlos",
    arr:1,dep:3,rooms:40,
    rtype:"Trad. 2 Doubles",
    rate:"$124",billing:"Individual",
    notes:["Breakfast incl.","Dance group New Berlin","Individual reservations"],
    alert:null,check:false,master:false
  },
  {
    org:"Ernst & Young — ETS Baseball",
    contact:"Joe McCarney",
    arr:1,dep:3,rooms:38,
    rtype:"Trad. 2 Queens",
    rate:"$105",billing:"Individual",
    notes:["Breakfast incl.","Baseball New Berlin","Individual reservations"],
    alert:"Peak 45 attendees",check:false,master:false
  },
  {
    org:"The Powers Company",
    contact:"Alejandra Gonzalez-Hernandez",
    arr:1,dep:31,rooms:105,
    rtype:"Trad. 1 King",
    rate:"$104",billing:"Individual",
    notes:["20-week project","IPO courtesy block","Rooming list","Arthur Travel intermediary"],
    alert:"Long-term block May 1–31 · 5 rooms/night",check:false,master:false
  },
  {
    org:"Bob Rogers Travel — Joliet D86",
    contact:"Jessica Sanabria",
    arr:7,dep:9,rooms:28,
    rtype:"1 King + 2 Doubles (Quad occ.)",
    rate:"$124",billing:"Master Bill",
    notes:["All charges to master","Rooming list","No posting / pre-key","Comp. breakfast in private banquet space","Card down for incidentals"],
    alert:"MASTER BILL — no posting to rooms",check:false,master:true
  },
  {
    org:"Ponds of Brookfield — Minnesota Wilderness",
    contact:"Greg Copeland",
    arr:7,dep:9,rooms:34,
    rtype:"Trad. 2 Queens",
    rate:"$50",billing:"Master Bill",
    notes:["Direct billed","Early check-in Thu 1 PM","Late check-out Sat 5 PM","Bus arrival — pre-key","Meeting room Moorland 5","Breakfast incl."],
    alert:"Early CI / Late CO · $50 rate · Bus group",check:false,master:true
  },
  {
    org:"Michigan Hawks Soccer Club",
    contact:"Michelle Creger",
    arr:8,dep:11,rooms:62,
    rtype:"Trad. 2 Doubles",
    rate:"$119",billing:"Individual",
    notes:["BBK 1/40 comp","Breakfast incl.","Comp parking","Individual reservations"],
    alert:null,check:false,master:false
  },
  {
    org:"MKESI Sports — Michigan Stars FC",
    contact:"Kristina Turchi",
    arr:8,dep:10,rooms:60,
    rtype:"Trad. 2 Queens",
    rate:"$109",billing:"Individual",
    notes:["Sports team","Individual pay own","Breakfast incl."],
    alert:null,check:false,master:false
  },
  {
    org:"Badger Color Concentrates",
    contact:"Mark Zolty",
    arr:9,dep:16,rooms:70,
    rtype:"Trad. 1 King",
    rate:"$135",billing:"Individual",
    notes:["Rooming list","BT rate + Club Level","Club lounge — good service req.","Moldy berry issue noted"],
    alert:"Club lounge service alert",check:false,master:false
  },
  {
    org:"Eaton Corporation — Voltage Training",
    contact:"John Thierfelder",
    arr:11,dep:14,rooms:45,
    rtype:"Trad. 1 King",
    rate:"$124",billing:"Individual",
    notes:["Repeat client","Rooming list","Airport shuttle needed","May add more rooms"],
    alert:"Airport shuttle required",check:false,master:false
  },
  {
    org:"Dixon Sanitary — Bi-Annual",
    contact:"Erin Mazer",
    arr:12,dep:14,rooms:20,
    rtype:"Trad. 1 King",
    rate:"$149",billing:"Master Bill",
    notes:["Room & tax to master","Rooming list","Craft room happy hour possible","New contact: Erin Mazer"],
    alert:null,check:false,master:true
  },
  {
    org:"LaSaffre Yeast Corporation",
    contact:"Sandra Kuehn",
    arr:12,dep:15,rooms:45,
    rtype:"Trad. 1 King",
    rate:"$135",billing:"Individual",
    notes:["No breakfast","No onsite meetings","Individual reservations"],
    alert:null,check:false,master:false
  },
];

let cur='all';
function filtered(){return cur==='all'?groups:groups.filter(g=>g.arr===cur);}

function renderStats(list){
  const total=list.reduce((s,g)=>s+g.rooms,0);
  const alerts=list.filter(g=>g.alert).length;
  const masters=list.filter(g=>g.master).length;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-label">Groups</div><div class="stat-val">${list.length}</div><div class="stat-sub">in view</div></div>
    <div class="stat"><div class="stat-label">Total rooms</div><div class="stat-val">${total.toLocaleString()}</div><div class="stat-sub">contracted</div></div>
    <div class="stat"><div class="stat-label">Alerts</div><div class="stat-val ${alerts?'v-amber':''}">${alerts}</div><div class="stat-sub">need attention</div></div>
    <div class="stat"><div class="stat-label">Master bill</div><div class="stat-val ${masters?'v-green':''}">${masters}</div><div class="stat-sub">group${masters!==1?'s':''}</div></div>
  `;
}

function renderTable(list){
  const tb=document.getElementById('tbody');
  if(!list.length){tb.innerHTML='<tr class="empty-row"><td colspan="6">No groups for this date</td></tr>';return;}
  const byDay={};
  list.forEach(g=>{(byDay[g.arr]=byDay[g.arr]||[]).push(g);});
  const days=Object.keys(byDay).sort((a,b)=>a-b);
  tb.innerHTML=days.map(d=>`
    ${cur==='all'?`<tr class="day-row"><td colspan="6">May ${d} &nbsp;·&nbsp; ${dayOfWeek[d]||''}</td></tr>`:''}
    ${byDay[d].map(g=>`
      <tr class="${g.alert&&!g.master?'row-alert':''} ${g.master?'row-master':''}">
        <td><div class="cell-org">${g.org}</div><div class="cell-contact">${g.contact}</div></td>
        <td class="cell-dates">May ${g.arr} → May ${g.dep}</td>
        <td><div class="cell-rooms">${g.rooms}</div><div class="cell-roomtype">${g.rtype}</div></td>
        <td class="cell-rate">${g.rate}/nt</td>
        <td><span class="badge ${g.master?'b-master':'b-indi'}">${g.billing}</span></td>
        <td>
          <div class="notes">
            ${g.alert?`<span class="note-tag ${g.check?'note-check':'note-alert'}">${g.alert}</span>`:''}
            ${g.notes.map(n=>`<span class="note-tag">${n}</span>`).join('')}
          </div>
        </td>
      </tr>
    `).join('')}
  `).join('');
}

function filter(d,el){
  cur=d;
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  const list=filtered();
  renderStats(list);
  renderTable(list);
}

renderStats(filtered());
renderTable(filtered());
</script>
</body>
</html>
