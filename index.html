
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="5;url=https://hkaksu.com/">
  <title>We've Moved | HKAKSU Workspace</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #080e19;
      --surface: #111b2b;
      --border: #2c3e56;
      --text: #f0f5ff;
      --muted: #a8bad3;
      --accent: #8daeff;
      --green: #6ee7c2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at 50% 20%, #1a2c4d, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 510px;
      padding: 48px 36px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border: 1px solid #49618a;
      background: #1a2a43;
      border-radius: 18px;
      font-size: 30px;
      font-weight: 800;
    }

    .brand {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--accent);
    }

    .eyebrow {
      display: inline-block;
      margin-top: 30px;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(30px, 6vw, 42px);
      letter-spacing: -1px;
    }

    p {
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
      margin: 0 auto 26px;
    }

    .button {
      display: block;
      background: #3769c7;
      color: white;
      padding: 15px 20px;
      border-radius: 11px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: background .2s;
    }

    .button:hover {
      background: #4d80df;
    }

    .url {
      margin-top: 18px;
      font-size: 13px;
      color: var(--accent);
    }

    .footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    .progress {
      height: 3px;
      margin-top: 18px;
      background: #273850;
      overflow: hidden;
      border-radius: 10px;
    }

    .progress::before {
      content: "";
      display: block;
      height: 100%;
      width: 100%;
      background: var(--green);
      transform-origin: left;
      animation: countdown 5s linear forwards;
    }

    @keyframes countdown {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }

    @media (max-width: 500px) {
      .card { padding: 36px 22px; }
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="logo">H</div>
    <div class="brand">HKAKSU WORKSPACE</div>

    <div class="eyebrow">A New Home for Our Tools</div>

    <h1>We've Moved!</h1>

    <p>
      This application is now part of the new
      <strong style="color:#fff">HKAKSU Workspace</strong>.
      All our tools and applications are available
      in one centralized location.
    </p>

    <a class="button" href="https://hkaksu.com/">
      Continue to New Website &rarr;
    </a>

    <div class="url">hkaksu.com</div>

    <div class="footer">
      You will be redirected automatically in
      <strong id="countdown">5</strong> seconds.
      <div class="progress"></div>
    </div>
  </main>

  <script>
    let seconds = 5;

    const timer = setInterval(() => {
      seconds--;
      document.getElementById("countdown").textContent =
        Math.max(seconds, 0);

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace("https://hkaksu.com/");
      }
    }, 1000);
  </script>

</body>
</html>
